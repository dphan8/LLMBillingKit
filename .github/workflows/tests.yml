name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest LLMBillingKit/tests -q

  e2e-openai:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install openai

      - name: Run e2e smoke test
        if: env.OPENAI_API_KEY != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        run: python test_e2e.py

      - name: Skip note when secret is unavailable
        if: env.OPENAI_API_KEY == '' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)
        run: echo "Skipping e2e test because OPENAI_API_KEY is unavailable for this run."
